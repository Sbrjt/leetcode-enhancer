name: Weekly Test

on:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/actions/install

      - name: Build
        uses: ./.github/actions/build

      - name: Playwright Test
        uses: ./.github/actions/test

runs:
  using: 'composite'
  steps:
    - name: Install Playwright
      shell: bash
      run: npx playwright install --with-deps --no-shell chromium

    - name: Run Playwright tests
      uses: nick-fields/retry@v3
      with:
        max_attempts: 3
        timeout_minutes: 30
        command: xvfb-run npm test
        new_command_on_retry: xvfb-run npx playwright test --last-failed
